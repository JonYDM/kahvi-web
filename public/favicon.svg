<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Taza de café simple — paleta Kahvi -->
  <!-- Cuerpo de la taza -->
  <rect x="6" y="14" width="18" height="12" rx="3" fill="#6B4F3B"/>
  <!-- Boca de la taza (elipse) -->
  <ellipse cx="15" cy="14" rx="9" ry="3" fill="#2B1F19"/>
  <!-- Café interior -->
  <ellipse cx="15" cy="14" rx="7" ry="2" fill="#C9BB5A"/>
  <!-- Asa -->
  <path d="M24 17 Q30 17 30 21 Q30 25 24 25" stroke="#6B4F3B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Platillo -->
  <ellipse cx="15" cy="26" rx="11" ry="2.5" fill="#6B4F3B"/>
  <!-- Vapor izquierdo -->
  <path d="M11 11 Q9.5 8.5 11 6" stroke="#6FAF9A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Vapor derecho -->
  <path d="M15 10 Q13.5 7.5 15 5" stroke="#6FAF9A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Vapor centro-der -->
  <path d="M19 11 Q17.5 8.5 19 6" stroke="#6FAF9A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
